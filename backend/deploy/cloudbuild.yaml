# Builds one service image from the backend/ monorepo; `images:` pushes it to Artifact Registry;
# deploy/deploy.sh then deploys it to Cloud Run.
#
# Usage (run from backend/):
#   gcloud builds submit --region asia-south1 --config deploy/cloudbuild.yaml \
#     --substitutions=_SERVICE=nse-service,_REGION=asia-south1,_TAG=manual
#
# Secrets (NSE_*, MAILGUN_*) are expected in Secret Manager and are attached
# by deploy/deploy.sh, not baked into the image.
substitutions:
  _SERVICE: nse-service
  _REGION: asia-south1
  _REPO: gowealthy
  _TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - services/${_SERVICE}/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
