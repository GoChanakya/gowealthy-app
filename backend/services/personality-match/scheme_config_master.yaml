    growth_mix: balanced
    tau: 1.05
    willingness_grade: 6
    complex_access: true
    basket: { core: 0.60, growth: 0.30, satellite: 0.10, core_min_aum_pct: 0.40, rising_star_slots: [{ min_funds: 5, slots: 1 }] }
  LHH:
    name: Masterful Strategist
