    weights: { resilience: 0.20, consistency: 0.30, growth: 0.35, stature: 0.15, turnaround: 0.00 }
    growth_mix: balanced
    tau: 1.10
    willingness_grade: 7
    complex_access: true
    basket: { core: 0.50, growth: 0.35, satellite: 0.15, core_min_aum_pct: null, rising_star_slots: [{ min_funds: 3, slots: 1 }, { min_funds: 7, slots: 2 }] }
