meta:
  config_version: "1.0.0"
  method_version: "personality-match-v1"
  calibration_version: "precal-0"
  as_of: "2026-09-26"
  schema_target: "fund-cards 1.1"

universe:
  scored_categories: all_listed_in_categories
  plan_rule: primary_only
  min_history_months: 6
  out_of_universe_policy: no_score

categories:
  EQ-LC: { label: Large Cap, grade: 4, role: core, complex: false, parent: EQ-LARGE }
  EQ-IDX-LC: { label: Large Cap Index, grade: 4, role: core, complex: false, parent: EQ-LARGE }
  HY-MAA: { label: Multi Asset Allocation, grade: 4, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-FC: { label: Flexi Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-MLC: { label: Multi Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-LMC: { label: Large & Mid Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-FOC: { label: Focused, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-VAL: { label: Value, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQ-CON: { label: Contra, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQ-DIV: { label: Dividend Yield, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQ-IDX-BR: { label: Broad Market Index, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQ-ELSS: { label: ELSS (Tax Saver), grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED, auto_recommend: false }
  EQ-MC: { label: Mid Cap, grade: 6, role: growth, complex: false, parent: EQ-MIDSMALL }
  EQ-IDX-MC: { label: Mid Cap Index, grade: 6, role: growth, complex: false, parent: EQ-MIDSMALL }
  EQ-SC: { label: Small Cap, grade: 7, role: growth, complex: false, parent: EQ-MIDSMALL }
  EQ-IDX-SC: { label: Small Cap Index, grade: 7, role: growth, complex: false, parent: EQ-MIDSMALL }
  EQ-INTL: { label: International / Global, grade: 6, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQ-SEC: { label: Sectoral, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQ-THM: { label: Thematic, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }

  # Live Scheme Master codes. The older EQ-* entries above remain supported
  # for backward-compatible fixtures and historical output.
  EQS-LRG: { label: Large Cap, grade: 4, role: core, complex: false, parent: EQ-LARGE }
  EQS-FLX: { label: Flexi Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQS-MUC: { label: Multi Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQS-LMF: { label: Large & Mid Cap, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQS-FOC: { label: Focused, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQS-VAL: { label: Value, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQS-CTR: { label: Contra, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQS-DYF: { label: Dividend Yield, grade: 5, role: core, complex: false, parent: EQ-STYLE }
  EQS-ELS: { label: ELSS (Tax Saver), grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED, auto_recommend: false }
  EQS-MID: { label: Mid Cap, grade: 6, role: growth, complex: false, parent: EQ-MIDSMALL }
  EQS-SMC: { label: Small Cap, grade: 7, role: growth, complex: false, parent: EQ-MIDSMALL }
  OTH-EQS: { label: Equity Index, grade: 5, role: core, complex: false, parent: EQ-DIVERSIFIED }
  EQS-SCT-BFI: { label: Banking and Financial Services, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-CON: { label: Consumption, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-INF: { label: Infrastructure, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-CYC: { label: Business Cycles, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-HLT: { label: Healthcare, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-DIG: { label: Digital and Technology, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-QNT: { label: Quantitative, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-MNF: { label: Manufacturing, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-INN: { label: Innovation, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-ESG: { label: ESG, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-SBT: { label: Special Situations, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-ENR: { label: Energy, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-SSC: { label: Services, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-PSU: { label: PSU, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-COM: { label: Commodities, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }
  EQS-SCT-ETH: { label: Ethical, grade: 7, role: satellite, complex: true, parent: EQ-SATELLITE }

source_adapter:
  fund_persona_map:
    "The Steady Compounder": STEADY_CLIMBER
    "The Sprinter": SPRINTER
    "The Daredevil": EXPLORER
    "All-Weather Champion": CUSHION
    "The Defender": CUSHION

peer_groups:
  percentile_group: category
  min_peers: 8
  reference_fall_group: [EQ-LC, EQ-IDX-LC, EQS-LRG]

features:
  downside_participation: { k: 6, min_events_full_confidence: 3 }
  recovery_ratio: { intercept: 1.5 }
  unrecovered_penalty: { max_penalty: 0.20 }
  batting_average: { prior_k: 6, prior_mean: 0.5, score_floor: 0.35, score_range: 0.40 }
  rank_stability: { max_mean_move: 0.15 }
  rank_trend: { neutral: 0.5, slope_scale: 0.06 }
  track_record: { full_years: 10 }
  turnaround: { never_bottom_half_score: 0.25, climb_scale: 0.40 }

percentile_method:
  formula: "(average_rank - 0.5) / n"
  population: primary schemes in peer group with a non-null value

pillar_features:
  resilience: { downside_participation: 0.60, recovery_ratio: 0.40 }
  consistency: { batting_average: 0.60, rank_stability: 0.40 }
  stature: { aum: 0.60, track_record: 0.40 }
  turnaround: { turnaround: 1.00 }
  growth: persona_specific

growth_mixes:
  compounding: { sip_3y: 0.40, alpha_3y: 0.25, rank_level: 0.20, return_1y: 0.15, rank_trend: 0.00 }
  balanced: { sip_3y: 0.25, alpha_3y: 0.25, rank_level: 0.20, return_1y: 0.15, rank_trend: 0.15 }
  momentum: { sip_3y: 0.10, alpha_3y: 0.15, rank_level: 0.30, return_1y: 0.20, rank_trend: 0.25 }

missing_data:
  feature_null: drop_and_renormalise
  pillar_all_null: 0.5
  history_full_confidence_months: 36
  not_applicable_events: excluded

personas:
  LLL:
    name: Realistic Guardian
    ideal_grade: 4.0
    weights: { resilience: 0.45, consistency: 0.25, growth: 0.10, stature: 0.20, turnaround: 0.00 }
    growth_mix: compounding
    tau: 0.95
    willingness_grade: 6
    complex_access: false
    basket: { core: 0.80, growth: 0.20, satellite: 0.00, core_min_aum_pct: 0.50, rising_star_slots: [] }
  LHL:
    name: Prudent Treasurer
    ideal_grade: 4.25
    weights: { resilience: 0.35, consistency: 0.35, growth: 0.10, stature: 0.20, turnaround: 0.00 }
    growth_mix: compounding
    tau: 0.97
    willingness_grade: 6
    complex_access: true
    basket: { core: 0.75, growth: 0.25, satellite: 0.00, core_min_aum_pct: 0.50, rising_star_slots: [] }
  HLL:
    name: Inspiring Storyteller
    ideal_grade: 4.5
    weights: { resilience: 0.35, consistency: 0.25, growth: 0.15, stature: 0.25, turnaround: 0.00 }
    growth_mix: compounding
    tau: 1.00
    willingness_grade: 6
    complex_access: false
    basket: { core: 0.70, growth: 0.30, satellite: 0.00, core_min_aum_pct: 0.50, rising_star_slots: [] }
