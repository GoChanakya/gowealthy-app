    basket: { core: 0.45, growth: 0.40, satellite: 0.15, core_min_aum_pct: null, rising_star_slots: [], turnaround_slots: [{ min_funds: 2, slots: 1, min_turnaround: 0.50 }] }
  HLH:
    name: Supreme Ruler
