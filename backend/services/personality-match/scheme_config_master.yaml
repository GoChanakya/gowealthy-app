    basket: { core: 0.40, growth: 0.45, satellite: 0.15, core_min_aum_pct: null, rising_star_slots: [] }
  HHH:
    name: Bold Pioneer
    ideal_grade: 6.5
    weights: { resilience: 0.15, consistency: 0.20, growth: 0.55, stature: 0.10, turnaround: 0.00 }
    growth_mix: momentum
    tau: 1.25
    willingness_grade: 7
    complex_access: true
    basket: { core: 0.35, growth: 0.40, satellite: 0.25, core_min_aum_pct: null, rising_star_slots: [] }

persona_rules:
  resilience_floor: 0.15
  dial_threshold: 6
  store_raw_dials: true
  satellite_blocked_redirect: growth

fund_persona_affinity:
  default: 0.50
  LLL: { STEADY_CLIMBER: 0.8, SPRINTER: 0.2, CUSHION: 1.0, EXPLORER: 0.1 }
  LHL: { STEADY_CLIMBER: 0.9, SPRINTER: 0.3, CUSHION: 0.9, EXPLORER: 0.2 }
  HLL: { STEADY_CLIMBER: 0.9, SPRINTER: 0.4, CUSHION: 0.8, EXPLORER: 0.3 }
  HHL: { STEADY_CLIMBER: 1.0, SPRINTER: 0.5, CUSHION: 0.7, EXPLORER: 0.4 }
  LHH: { STEADY_CLIMBER: 0.8, SPRINTER: 0.8, CUSHION: 0.4, EXPLORER: 0.7 }
  LLH: { STEADY_CLIMBER: 0.6, SPRINTER: 0.5, CUSHION: 0.4, EXPLORER: 1.0 }
  HLH: { STEADY_CLIMBER: 0.6, SPRINTER: 1.0, CUSHION: 0.2, EXPLORER: 0.7 }
  HHH: { STEADY_CLIMBER: 0.5, SPRINTER: 1.0, CUSHION: 0.2, EXPLORER: 0.9 }

composition:
  fit_weight: 0.80
  affinity_weight: 0.10
  style_weight: 0.10
  style_grade_span: 3
  score_scale: 100

calibration:
  method: piecewise_linear_fixed_anchors
  anchors_display: [0, 40, 62, 78, 88, 97]
  anchor_quantiles: [min, 0.10, 0.50, 0.85, 0.97, max]
  default_anchors_base: [0, 35, 50, 62, 70, 85]
  per_persona_anchors_base: {}
  max_great_share: 0.10

gates:
  persona_level:
    grade_over_by_1_cap: 69
    grade_over_by_2plus_cap: 54
    complex_without_access_cap: 69
    history_under_months: 12
    history_under_12m_cap: 69
  user_level:
    grade_over_by_1_cap: 69
    grade_over_by_2plus_cap: 54
    loss_reaction_sell_grade_penalty: 1
    min_allowed_grade: 4

user_adjustment:
  blend_anchor_persona: LLL
  missing_field_points: 0
  age_bands:
    - { band: "18-25", min: 18, max: 25, points: 2, default_horizon_years: 10 }
    - { band: "26-35", min: 26, max: 35, points: 2, default_horizon_years: 10 }
    - { band: "36-45", min: 36, max: 45, points: 1, default_horizon_years: 10 }
    - { band: "46-55", min: 46, max: 55, points: 0, default_horizon_years: 8 }
    - { band: "56-65", min: 56, max: 65, points: -1, default_horizon_years: 6 }
    - { band: "66+", min: 66, max: 120, points: -2, default_horizon_years: 4 }
  capacity_points:
    living: { family: 1, renting: 0, own_emi: -1 }
    emi_ratio_pct:
      - { max: 30, points: 0 }
      - { max: 50, points: -1 }
      - { max: 999, points: -2 }
    spouse_income: { has: 1, none: 0 }
    dependents_non_earning:
      - { max: 2, points: 0 }
      - { max: 99, points: -1 }
    emergency_fund: { funded: 1, partial: 0, none: -1 }
    health_insurance: { has: 0, none: -1 }
  capacity_tiers:
    - { tier: 4, min_points: 3, capacity_grade: 7, beta: 0.00 }
    - { tier: 3, min_points: 1, capacity_grade: 7, beta: 0.15 }
    - { tier: 2, min_points: -1, capacity_grade: 6, beta: 0.35 }
    - { tier: 1, min_points: -99, capacity_grade: 5, beta: 0.55 }
  horizon:
    source: general
    grade_by_years:
      - { min_years: 7, grade: 7 }
      - { min_years: 5, grade: 6 }
      - { min_years: 3, grade: 5 }
      - { min_years: 0, grade: 4 }

bands:
  - { code: GREAT, min: 85, label: "Great fit" }
  - { code: GOOD, min: 70, label: "Good fit" }
  - { code: FAIR, min: 55, label: "Fair fit" }
  - { code: STRETCH, min: 40, label: "A stretch for you" }
  - { code: NOT, min: 0, label: "Not suited to you" }
recommend_floor: 40
basket_min_score: 55

amount_bands:
  applies_to: monthly_sip
  min_per_fund: 500
  bands:
    - { code: A0, min: 500, max: 999, funds: 1, satellite_cap: 0.00, roles: [core] }
    - { code: A1, min: 1000, max: 4999, funds: 2, satellite_cap: 0.00, roles: [core, growth] }
    - { code: A2, min: 5000, max: 9999, funds: 3, satellite_cap: 0.10, roles: [core, growth, satellite] }
    - { code: A3, min: 10000, max: 19999, funds: 5, satellite_cap: 0.15, roles: [core, growth, satellite] }
    - { code: A4, min: 20000, max: 34999, funds: 7, satellite_cap: 0.20, roles: [core, growth, satellite] }
    - { code: A5, min: 35000, max: 99999999, funds: 9, satellite_cap: 0.25, roles: [core, growth, satellite] }

basket_rules:
  diversification:
    max_per_category_first_pass: 1
    max_per_category: 2
    max_per_amc: 2
    one_index_per_index_family: true
    max_holdings_overlap_pct: 60
  rising_star:
    max_aum_pct: 0.40
    min_track_record_years: 2
    min_rank_level: 0.70
    min_rank_trend: 0.60
    excluded_from_core_for: [LLL, LHL, HLL]
  amount_rounding: 100

reasons:
  max: 2
  min_contribution: 0.02
  positive:
    resilience: { code: SMALLER_FALLS, text: "Fell less than most funds in past crashes" }
    consistency: { code: STEADY_BEATS, text: "Beats its category month after month" }
    growth: { code: STRONG_CLIMB, text: "Climbing its category ranks with strong returns" }
    stature: { code: TRUSTED_SIZE, text: "Large, long-running fund many investors trust" }
    turnaround: { code: COMEBACK, text: "Climbing back from the bottom of its category" }
    style: { code: YOUR_STYLE, text: "The kind of fund your persona leans toward" }
  negative:
    resilience: { code: BIGGER_FALLS, text: "Fell more than most funds in past crashes" }
    consistency: { code: PATCHY, text: "Beats its category only some months" }
    growth: { code: LAGGING, text: "Trailing its category on returns" }
    stature: { code: SMALL_OR_NEW, text: "Smaller or newer than its peers" }
    turnaround: { code: NO_COMEBACK, text: "No sign of a turnaround yet" }
    style_tame: { code: TAMER_THAN_YOU, text: "Steadier than your usual style" }
    style_wild: { code: WILDER_THAN_YOU, text: "Swings harder than your usual style" }
  gate:
    grade_over: { code: RISKIER_THAN_YOU, text: "Riskier than your comfort zone" }
    complex: { code: NICHE_BET, text: "A concentrated bet that needs close tracking" }
    history: { code: TOO_NEW, text: "Too new to judge fully" }
    capacity: { code: SAFETY_FIRST, text: "Your current commitments call for steadier funds" }

field_aliases:
  is_primary: [isprimary_v1, is_primary]
  primary_scheme_code: [primary_scheme_code]
  aum_cr: [aum_cr, aum]
  inception_date: [inception_date]
  alpha_3y_pct: [alpha_3y_pct, alpha_3y]
  min_sip_amount: [min_sip_amount]
  batting_36m: [batting_36m]
  holdings: [holdings]
